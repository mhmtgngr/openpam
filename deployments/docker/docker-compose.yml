version: "3.8"

# OpenPAM - Privileged Access Management Platform
# Docker Compose configuration for local development

# Common extra_hosts for all services to fix Podman DNS resolution
x-extra-hosts: &extra-hosts
  - "postgres:10.89.0.2"
  - "redis:10.89.0.3"
  - "minio:10.89.0.4"
  - "gateway:10.89.0.5"
  - "session-service:10.89.0.6"
  - "vault-service:10.89.0.7"
  - "credential-service:10.89.0.8"
  - "audit-service:10.89.0.9"
  - "admin-service:10.89.0.10"
  - "discovery-service:10.89.0.11"
  - "analytics-service:10.89.0.12"

services:
  # ============================================
  # Infrastructure Services
  # ============================================

  postgres:
    image: postgres:16-alpine
    container_name: openpam-postgres
    user: "0:0"  # Run as root to fix permissions, then drops to postgres
    environment:
      POSTGRES_USER: openpam
      POSTGRES_PASSWORD: openpam_dev
      POSTGRES_DB: openpam
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
      - ./postgres-tls:/tls:ro
      - ./postgres-entrypoint.sh:/entrypoint.sh:ro
    entrypoint:
      - /bin/sh
      - /entrypoint.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openpam"]
      interval: 5s
      timeout: 3s
      retries: 5
    extra_hosts: *extra-hosts
    networks:
      openpam-net:
        ipv4_address: 10.89.0.2

  redis:
    image: redis:7-alpine
    container_name: openpam-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    extra_hosts: *extra-hosts
    networks:
      openpam-net:
        ipv4_address: 10.89.0.3

  minio:
    image: minio/minio:latest
    container_name: openpam-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-openpam_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-OpenPAM_Dev_Secret_Change_Me_2024}
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
    extra_hosts: *extra-hosts
    networks:
      openpam-net:
        ipv4_address: 10.89.0.4

  # ============================================
  # OpenPAM Services
  # ============================================

  gateway:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.gateway
    container_name: openpam-gateway
    ports:
      - "8500:8500"
    environment:
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: openpam
      DB_PASSWORD: openpam_dev
      DB_NAME: openpam
      DB_SSLMODE: no-verify

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0

      # Service
      PORT: 8500
      LOG_LEVEL: debug
      ENVIRONMENT: development

      # JWT (in production, mount keys as volume)
      JWT_PRIVATE_KEY_PATH: /etc/openpam/jwt/private.pem
      JWT_PUBLIC_KEY_PATH: /etc/openpam/jwt/public.pem

      # Encryption
      MASTER_KEY: ${MASTER_KEY:-development-key-32-bytes-long-!!}

      # Session storage
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-openpam_admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-OpenPAM_Dev_Secret_Change_Me_2024}
      MINIO_BUCKET: openpam-sessions
      MINIO_USE_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./jwt-keys:/etc/openpam/jwt
      - ./postgres-tls/ca.crt:/etc/ssl/certs/postgresql-ca.crt:ro
    extra_hosts: *extra-hosts
    networks:
      openpam-net:
        ipv4_address: 10.89.0.5
    restart: unless-stopped

  session-service:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.session-service
    container_name: openpam-session-service
    ports:
      - "8501:8501"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: openpam
      DB_PASSWORD: openpam_dev
      DB_NAME: openpam
      DB_SSLMODE: no-verify
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      PORT: 8501
      LOG_LEVEL: debug
      MASTER_KEY: ${MASTER_KEY:-development-key-32-bytes-long-!!}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./postgres-tls/ca.crt:/etc/ssl/certs/postgresql-ca.crt:ro
    extra_hosts: *extra-hosts
    networks:
      openpam-net:
        ipv4_address: 10.89.0.6
    restart: unless-stopped

  vault-service:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.vault-service
    container_name: openpam-vault-service
    ports:
      - "8502:8502"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: openpam
      DB_PASSWORD: openpam_dev
      DB_NAME: openpam
      DB_SSLMODE: no-verify
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      PORT: 8502
      LOG_LEVEL: debug
      MASTER_KEY: ${MASTER_KEY:-development-key-32-bytes-long-!!}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./postgres-tls/ca.crt:/etc/ssl/certs/postgresql-ca.crt:ro
    extra_hosts: *extra-hosts
    networks:
      openpam-net:
        ipv4_address: 10.89.0.7
    restart: unless-stopped

  credential-service:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.credential-service
    container_name: openpam-credential-service
    ports:
      - "8503:8503"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: openpam
      DB_PASSWORD: openpam_dev
      DB_NAME: openpam
      DB_SSLMODE: no-verify
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      PORT: 8503
      LOG_LEVEL: debug
      MASTER_KEY: ${MASTER_KEY:-development-key-32-bytes-long-!!}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./postgres-tls/ca.crt:/etc/ssl/certs/postgresql-ca.crt:ro
    extra_hosts: *extra-hosts
    networks:
      openpam-net:
        ipv4_address: 10.89.0.8
    restart: unless-stopped

  audit-service:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.audit-service
    container_name: openpam-audit-service
    ports:
      - "8504:8504"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: openpam
      DB_PASSWORD: openpam_dev
      DB_NAME: openpam
      DB_SSLMODE: no-verify
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      PORT: 8504
      LOG_LEVEL: debug
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./postgres-tls/ca.crt:/etc/ssl/certs/postgresql-ca.crt:ro
    extra_hosts: *extra-hosts
    networks:
      openpam-net:
        ipv4_address: 10.89.0.9
    restart: unless-stopped

  admin-service:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.admin-service
    container_name: openpam-admin-service
    ports:
      - "8505:8505"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: openpam
      DB_PASSWORD: openpam_dev
      DB_NAME: openpam
      DB_SSLMODE: no-verify
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      PORT: 8505
      LOG_LEVEL: debug
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts: *extra-hosts
    networks:
      openpam-net:
        ipv4_address: 10.89.0.10
    restart: unless-stopped

  discovery-service:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.discovery-service
    container_name: openpam-discovery-service
    ports:
      - "8506:8506"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: openpam
      DB_PASSWORD: openpam_dev
      DB_NAME: openpam
      DB_SSLMODE: no-verify
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      PORT: 8506
      LOG_LEVEL: debug
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./postgres-tls/ca.crt:/etc/ssl/certs/postgresql-ca.crt:ro
    extra_hosts: *extra-hosts
    networks:
      openpam-net:
        ipv4_address: 10.89.0.11
    restart: unless-stopped
    # Privileged mode for network scanning
    # In production, use separate scanning service
    cap_add:
      - NET_RAW
      - NET_ADMIN

  analytics-service:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.analytics-service
    container_name: openpam-analytics-service
    ports:
      - "8507:8507"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: openpam
      DB_PASSWORD: openpam_dev
      DB_NAME: openpam
      DB_SSLMODE: no-verify
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      PORT: 8507
      LOG_LEVEL: debug
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./postgres-tls/ca.crt:/etc/ssl/certs/postgresql-ca.crt:ro
    extra_hosts: *extra-hosts
    networks:
      openpam-net:
        ipv4_address: 10.89.0.12
    restart: unless-stopped

  # ============================================
  # Frontend (for development)
  # ============================================

  frontend:
    image: node:20-alpine
    container_name: openpam-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    volumes:
      - ../../frontend:/app:cached
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8500
    networks:
      - openpam-net
    profiles:
      - dev

  # ============================================
  # Nginx Reverse Proxy (production)
  # ============================================

  nginx:
    image: nginx:alpine
    container_name: openpam-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - gateway
    networks:
      - openpam-net
    profiles:
      - production

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  minio_data:
    driver: local

networks:
  openpam-net:
    driver: bridge
    name: openpam-net
    ipam:
      driver: default
      config:
        - subnet: 10.89.0.0/24
          gateway: 10.89.0.1
