version: "3.8"

# OpenPAM - Privileged Access Management Platform
# Docker Compose - ready to deploy configuration
#
# Usage:
#   make up          - Start all services (or: docker compose up -d)
#   make up-dev      - Start with frontend dev server
#   make up-prod     - Start with production frontend + nginx
#   make logs        - View logs
#   make down        - Stop all services
#
# First run: make setup (generates JWT keys and TLS certs)

# Common extra_hosts for all services to fix Podman DNS resolution
x-extra-hosts: &extra-hosts
  - "postgres:10.89.0.2"
  - "redis:10.89.0.3"
  - "minio:10.89.0.4"
  - "gateway:10.89.0.5"
  - "session-service:10.89.0.6"
  - "vault-service:10.89.0.7"
  - "credential-service:10.89.0.8"
  - "audit-service:10.89.0.9"
  - "admin-service:10.89.0.10"
  - "discovery-service:10.89.0.11"
  - "analytics-service:10.89.0.12"
  - "identity-service:10.89.0.13"
  - "frontend-prod:10.89.0.14"

# Common environment for all Go services
x-common-env: &common-env
  DB_HOST: postgres
  DB_PORT: 5432
  DB_USER: ${DB_USER:-openpam}
  DB_PASSWORD: ${DB_PASSWORD:-openpam_dev}
  DB_NAME: ${DB_NAME:-openpam}
  DB_SSLMODE: ${DB_SSLMODE:-disable}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ""
  REDIS_DB: 0
  LOG_LEVEL: ${LOG_LEVEL:-info}
  ENVIRONMENT: ${ENVIRONMENT:-production}
  MASTER_KEY: ${MASTER_KEY:-development-key-32-bytes-long-!!}

# Common depends_on for all Go services
x-common-depends: &common-depends
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  # ============================================
  # Infrastructure Services
  # ============================================

  postgres:
    image: postgres:16-alpine
    container_name: openpam-postgres
    user: "0:0"
    environment:
      POSTGRES_USER: ${DB_USER:-openpam}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-openpam_dev}
      POSTGRES_DB: ${DB_NAME:-openpam}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
      - ./postgres-tls:/tls:ro
      - ./postgres-entrypoint.sh:/entrypoint.sh:ro
    entrypoint:
      - /bin/bash
      - /entrypoint.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-openpam}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    extra_hosts: *extra-hosts
    networks:
      openpam-net:
        ipv4_address: 10.89.0.2
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: openpam-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    extra_hosts: *extra-hosts
    networks:
      openpam-net:
        ipv4_address: 10.89.0.3
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: openpam-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-openpam_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-OpenPAM_Dev_Secret_Change_Me_2024}
    ports:
      - "${MINIO_API_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_PORT:-9003}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    extra_hosts: *extra-hosts
    networks:
      openpam-net:
        ipv4_address: 10.89.0.4
    restart: unless-stopped

  # MinIO bucket initialization
  minio-init:
    image: minio/mc:latest
    container_name: openpam-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set openpam http://minio:9000 $${MINIO_ROOT_USER:-openpam_admin} $${MINIO_ROOT_PASSWORD:-OpenPAM_Dev_Secret_Change_Me_2024};
      mc mb --ignore-existing openpam/openpam-sessions;
      mc mb --ignore-existing openpam/openpam-recordings;
      echo 'MinIO buckets initialized';
      "
    extra_hosts: *extra-hosts
    networks:
      openpam-net:
        ipv4_address: 10.89.0.15

  # ============================================
  # OpenPAM Backend Services
  # ============================================

  gateway:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.gateway
    container_name: openpam-gateway
    ports:
      - "8500:8500"
    environment:
      <<: *common-env
      PORT: 8500
      JWT_PRIVATE_KEY_PATH: /etc/openpam/jwt/private.pem
      JWT_PUBLIC_KEY_PATH: /etc/openpam/jwt/public.pem
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-openpam_admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-OpenPAM_Dev_Secret_Change_Me_2024}
      MINIO_BUCKET: openpam-sessions
      MINIO_USE_SSL: "false"
      # Internal service URLs
      SESSION_SERVICE_URL: http://session-service:8501
      VAULT_SERVICE_URL: http://vault-service:8502
      CREDENTIAL_SERVICE_URL: http://credential-service:8503
      AUDIT_SERVICE_URL: http://audit-service:8504
      ADMIN_SERVICE_URL: http://admin-service:8505
      DISCOVERY_SERVICE_URL: http://discovery-service:8506
      ANALYTICS_SERVICE_URL: http://analytics-service:8507
      IDENTITY_SERVICE_URL: http://identity-service:8508
    depends_on:
      <<: *common-depends
      minio:
        condition: service_healthy
    volumes:
      - jwt_keys:/etc/openpam/jwt:ro
      - ./postgres-tls/ca.crt:/etc/ssl/certs/postgresql-ca.crt:ro
    extra_hosts: *extra-hosts
    networks:
      openpam-net:
        ipv4_address: 10.89.0.5
    restart: unless-stopped

  session-service:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.session-service
    container_name: openpam-session-service
    ports:
      - "8501:8501"
    environment:
      <<: *common-env
      PORT: 8501
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-openpam_admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-OpenPAM_Dev_Secret_Change_Me_2024}
      MINIO_BUCKET: openpam-recordings
      MINIO_USE_SSL: "false"
    depends_on:
      <<: *common-depends
    volumes:
      - ./postgres-tls/ca.crt:/etc/ssl/certs/postgresql-ca.crt:ro
    extra_hosts: *extra-hosts
    networks:
      openpam-net:
        ipv4_address: 10.89.0.6
    restart: unless-stopped

  vault-service:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.vault-service
    container_name: openpam-vault-service
    ports:
      - "8502:8502"
    environment:
      <<: *common-env
      PORT: 8502
    depends_on:
      <<: *common-depends
    volumes:
      - ./postgres-tls/ca.crt:/etc/ssl/certs/postgresql-ca.crt:ro
    extra_hosts: *extra-hosts
    networks:
      openpam-net:
        ipv4_address: 10.89.0.7
    restart: unless-stopped

  credential-service:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.credential-service
    container_name: openpam-credential-service
    ports:
      - "8503:8503"
    environment:
      <<: *common-env
      PORT: 8503
      VAULT_SERVICE_URL: http://vault-service:8502
    depends_on:
      <<: *common-depends
    volumes:
      - ./postgres-tls/ca.crt:/etc/ssl/certs/postgresql-ca.crt:ro
    extra_hosts: *extra-hosts
    networks:
      openpam-net:
        ipv4_address: 10.89.0.8
    restart: unless-stopped

  audit-service:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.audit-service
    container_name: openpam-audit-service
    ports:
      - "8504:8504"
    environment:
      <<: *common-env
      PORT: 8504
    depends_on:
      <<: *common-depends
    volumes:
      - ./postgres-tls/ca.crt:/etc/ssl/certs/postgresql-ca.crt:ro
    extra_hosts: *extra-hosts
    networks:
      openpam-net:
        ipv4_address: 10.89.0.9
    restart: unless-stopped

  admin-service:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.admin-service
    container_name: openpam-admin-service
    ports:
      - "8505:8505"
    environment:
      <<: *common-env
      PORT: 8505
    depends_on:
      <<: *common-depends
    volumes:
      - ./postgres-tls/ca.crt:/etc/ssl/certs/postgresql-ca.crt:ro
    extra_hosts: *extra-hosts
    networks:
      openpam-net:
        ipv4_address: 10.89.0.10
    restart: unless-stopped

  discovery-service:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.discovery-service
    container_name: openpam-discovery-service
    ports:
      - "8506:8506"
    environment:
      <<: *common-env
      PORT: 8506
    depends_on:
      <<: *common-depends
    volumes:
      - ./postgres-tls/ca.crt:/etc/ssl/certs/postgresql-ca.crt:ro
    extra_hosts: *extra-hosts
    networks:
      openpam-net:
        ipv4_address: 10.89.0.11
    restart: unless-stopped
    cap_add:
      - NET_RAW
      - NET_ADMIN

  analytics-service:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.analytics-service
    container_name: openpam-analytics-service
    ports:
      - "8507:8507"
    environment:
      <<: *common-env
      PORT: 8507
    depends_on:
      <<: *common-depends
    volumes:
      - ./postgres-tls/ca.crt:/etc/ssl/certs/postgresql-ca.crt:ro
    extra_hosts: *extra-hosts
    networks:
      openpam-net:
        ipv4_address: 10.89.0.12
    restart: unless-stopped

  identity-service:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.identity-service
    container_name: openpam-identity-service
    ports:
      - "8508:8508"
    environment:
      <<: *common-env
      PORT: 8508
    depends_on:
      <<: *common-depends
    volumes:
      - ./postgres-tls/ca.crt:/etc/ssl/certs/postgresql-ca.crt:ro
    extra_hosts: *extra-hosts
    networks:
      openpam-net:
        ipv4_address: 10.89.0.13
    restart: unless-stopped

  # ============================================
  # Frontend
  # ============================================

  # Development frontend (hot reload)
  frontend-dev:
    image: node:20-alpine
    container_name: openpam-frontend-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "3000:3000"
    volumes:
      - ../../frontend:/app:cached
      - frontend_node_modules:/app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8500
    extra_hosts: *extra-hosts
    networks:
      - openpam-net
    profiles:
      - dev

  # Production frontend (built + served via nginx)
  frontend-prod:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.frontend
    container_name: openpam-frontend-prod
    ports:
      - "8580:8580"
    depends_on:
      - gateway
    extra_hosts: *extra-hosts
    networks:
      openpam-net:
        ipv4_address: 10.89.0.14
    restart: unless-stopped

  # ============================================
  # Nginx Reverse Proxy (production with TLS)
  # ============================================

  nginx:
    image: nginx:alpine
    container_name: openpam-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - gateway
      - frontend-prod
    extra_hosts: *extra-hosts
    networks:
      - openpam-net
    restart: unless-stopped
    profiles:
      - production

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  minio_data:
    driver: local
  jwt_keys:
    driver: local
  frontend_node_modules:
    driver: local

networks:
  openpam-net:
    driver: bridge
    name: openpam-net
    ipam:
      config:
        - subnet: 10.89.0.0/24
          gateway: 10.89.0.1
